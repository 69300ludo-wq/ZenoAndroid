name: Build Zeno Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Activer le micro direct Zeno
        run: |
          sed -i '0,/    chat,/s//    lambda _: chat,/' tools/fix_micro.py
          python3 tools/fix_micro.py

      - name: Regrouper les modules sur accueil
        run: python3 tools/home_modules.py

      - name: Ajouter le bouton vocal sur accueil
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/zeno/robot/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          needle = '''                Row(
                              Modifier.fillMaxWidth().padding(top = 16.dp),
                              horizontalArrangement = Arrangement.Center,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text(
                                  "Paramètres",'''
          replacement = '''                Spacer(Modifier.height(14.dp))
                          Row(
                              Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.Center
                          ) {
                              Surface(
                                  modifier = Modifier.size(68.dp).clickable {
                                      context.startActivity(Intent(context, VoiceCommandActivity::class.java))
                                  },
                                  shape = CircleShape,
                                  color = accent.copy(alpha = .24f),
                                  border = androidx.compose.foundation.BorderStroke(2.dp, Color(0xFF59D8FF))
                              ) {
                                  Box(contentAlignment = Alignment.Center) {
                                      Icon(
                                          Icons.Default.Mic,
                                          contentDescription = "Lancer le vocal Zeno",
                                          tint = Color.White,
                                          modifier = Modifier.size(34.dp)
                                      )
                                  }
                              }
                          }
                          Text(
                              "Parler à Zeno",
                              color = Color(0xFFBFD7FF),
                              fontSize = 12.sp,
                              textAlign = TextAlign.Center,
                              modifier = Modifier.fillMaxWidth().padding(top = 6.dp)
                          )
                          Row(
                              Modifier.fillMaxWidth().padding(top = 12.dp),
                              horizontalArrangement = Arrangement.Center,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text(
                                  "Paramètres",'''
          if needle not in s:
              raise SystemExit("Emplacement du bouton vocal introuvable")
          p.write_text(s.replace(needle, replacement, 1), encoding='utf-8')
          print("Bouton vocal accueil ajouté")
          PY

      - name: Activer la phrase de réveil personnalisable
        run: python3 tools/custom_wake_phrase.py

      - name: Ajuster interface et icones applications
        run: python3 tools/ui_polish.py

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zeno-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

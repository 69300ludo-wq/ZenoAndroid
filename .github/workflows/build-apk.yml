name: Build Zeno Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.5'
      - name: Create Gradle wrapper
        run: gradle wrapper --gradle-version 8.14.5
      - name: Activer le micro direct Zeno
        run: |
          sed -i '0,/    chat,/s//    lambda _: chat,/' tools/fix_micro.py
          python3 tools/fix_micro.py
      - name: Regrouper les modules sur accueil
        run: python3 tools/home_modules.py
      - name: Ajouter le bouton vocal sur accueil
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/zeno/robot/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          needle = '''                Row(
                              Modifier.fillMaxWidth().padding(top = 16.dp),
                              horizontalArrangement = Arrangement.Center,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text(
                                  "Paramètres",'''
          replacement = '''                Spacer(Modifier.height(14.dp))
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.Center) {
                              Surface(modifier = Modifier.size(68.dp).clickable { context.startActivity(Intent(context, VoiceCommandActivity::class.java)) }, shape = CircleShape, color = accent.copy(alpha = .24f), border = androidx.compose.foundation.BorderStroke(2.dp, Color(0xFF59D8FF))) {
                                  Box(contentAlignment = Alignment.Center) { Icon(Icons.Default.Mic, contentDescription = "Lancer le vocal Zeno", tint = Color.White, modifier = Modifier.size(34.dp)) }
                              }
                          }
                          Text("Parler à Zeno", color = Color(0xFFBFD7FF), fontSize = 12.sp, textAlign = TextAlign.Center, modifier = Modifier.fillMaxWidth().padding(top = 6.dp))
                          Row(
                              Modifier.fillMaxWidth().padding(top = 12.dp),
                              horizontalArrangement = Arrangement.Center,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text(
                                  "Paramètres",'''
          if needle not in s: raise SystemExit("Emplacement du bouton vocal introuvable")
          p.write_text(s.replace(needle, replacement, 1), encoding='utf-8')
          PY
      - name: Préparer le moteur de phrase vocale
        run: python3 tools/custom_wake_phrase.py
      - name: Renforcer le déclenchement vocal
        run: python3 tools/voice_wake_reliability.py
      - name: Améliorer la détection à voix basse
        run: python3 tools/quiet_voice_wake.py
      - name: Ajouter le halo lumineux vocal
        run: python3 tools/voice_glow.py
      - name: Stabiliser la reconnaissance vocale
        run: python3 tools/voice_stability_fix.py
      - name: Remplacer le robot flottant par la lumière
        run: python3 tools/light_only_indicator.py
      - name: Ajuster interface et icones applications
        run: python3 tools/ui_polish.py
      - name: Ajouter les langues mondiales au traducteur
        run: |
          python3 tools/world_languages.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/zeno/robot/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          old = ').sortedBy { it.name }'
          new = ').filter { com.google.mlkit.nl.translate.TranslateLanguage.fromLanguageTag(it.tag) != null }.sortedBy { it.name }'
          if old not in s: raise SystemExit('Liste des langues introuvable')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Ajouter le mode SOS
        run: python3 tools/add_sos.py
      - name: Ajouter les commandes intelligentes
        run: python3 tools/smart_commands.py
      - name: Correctif final anti-plantage
        run: python3 tools/final_runtime_stability.py
      - name: Verrouiller la session microphone
        run: python3 tools/voice_runtime_coordination.py
      - name: Nettoyage qualité final
        run: python3 tools/quality_cleanup.py
      - name: Sécuriser la préparation de la phrase
        run: python3 tools/wake_save_hardening.py
      - name: Fixer définitivement la phrase Salut Zeno
        run: python3 tools/fixed_wake_phrase.py
      - name: Supprimer le flottant et ajouter le rond personnalisable
        run: python3 tools/floating_single_mic.py
      - name: Vérifier et compiler APK
        run: ./gradlew lintDebug assembleDebug
      - name: Upload ZIP APK et rapport
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Zeno-v1.3.9-vocal-direct
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
